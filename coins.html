<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP by Coin - W1</title>
<style>
:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #21262d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --dim:     #484f58;
  --green:   #2ea043;
  --green-t: #3fb950;
  --green-bg:#0a1f0e;
  --red:     #da3633;
  --red-t:   #f85149;
  --red-bg:  #1e0a0a;
  --blue-t:  #58a6ff;
  --orange:  #f0883e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono','Cascadia Code','Fira Code',monospace;
  font-size: 12px;
  min-height: 100vh;
}

/* Header */
.hdr {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.hdr h1 { font-size: 15px; font-weight: 700; }
.hdr h1 em { color: var(--blue-t); font-style: normal; }
.hdr-links { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.hdr a {
  font-size: 11px;
  color: var(--dim);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  transition: color .15s, border-color .15s;
}
.hdr a:hover { color: var(--blue-t); border-color: var(--blue-t); }
.ts { font-size: 10px; color: var(--dim); }
.waddr-hdr { font-size: 11px; color: var(--muted); }

/* Stats bar */
.sbar {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 8px 20px;
  gap: 0;
  min-height: 48px;
  overflow-x: auto;
}
.sbar-divv {
  width: 1px;
  background: var(--border);
  align-self: stretch;
  margin: 0 16px;
  flex-shrink: 0;
}
.sbar-item {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-width: 70px;
}
.sbar-lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
.sbar-val { font-size: 13px; font-weight: 600; }
.pos { color: var(--green-t); }
.neg { color: var(--red-t); }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 2px;
  background: var(--border);
  padding: 0;
}
.card {
  background: var(--bg);
  padding: 16px;
  min-width: 0;
}

/* Card header */
.card-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.coin-tag {
  background: #0c1f3d;
  border: 1px solid #1f6feb66;
  border-radius: 4px;
  color: var(--blue-t);
  font-size: 13px;
  font-weight: 700;
  padding: 2px 10px;
}
.coin-pair { color: var(--muted); font-size: 11px; }
.cnt { margin-left: auto; font-size: 11px; color: var(--dim); }
.price-badge {
  font-size: 11px;
  color: var(--orange);
  border: 1px solid #3d2a0a;
  border-radius: 3px;
  padding: 1px 6px;
}

/* Chart */
.chart-wrap { position: relative; margin-bottom: 14px; }
.chart {
  position: relative;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}
.cur-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--orange);
  z-index: 10;
  pointer-events: none;
}
.cur-line::after {
  content: attr(data-price);
  position: absolute;
  right: 6px;
  top: -9px;
  font-size: 9px;
  color: var(--orange);
  white-space: nowrap;
  background: var(--surface);
  padding: 1px 3px;
}
.range-bar {
  position: absolute;
  border-radius: 3px;
  cursor: default;
  transition: opacity .15s;
}
.range-bar:hover { opacity: .85; }
.range-bar.in  { background: linear-gradient(90deg,#1a5c2a,var(--green),#1a5c2a); }
.range-bar.out { background: var(--red-bg); border: 1px solid #6b2020; }
.range-bar .tip {
  display: none;
  position: absolute;
  left: 50%; top: -24px;
  transform: translateX(-50%);
  background: #1c2128;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 9px;
  padding: 2px 6px;
  white-space: nowrap;
  z-index: 20;
}
.range-bar:hover .tip { display: block; }

/* Table */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.tbl th {
  text-align: left;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 0 6px 6px;
  border-bottom: 1px solid var(--border);
}
.tbl td {
  padding: 5px 6px;
  border-bottom: 1px solid #161b2266;
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }

.ctag {
  display: inline-block;
  font-size: 8px;
  font-weight: 700;
  background: #1c2a3a;
  border: 1px solid #2d5a8e66;
  color: var(--blue-t);
  border-radius: 3px;
  padding: 0 3px;
  margin-left: 3px;
  vertical-align: middle;
  text-transform: uppercase;
}
.fee-tag {
  display: inline-block;
  font-size: 8px;
  background: #1c1f26;
  border: 1px solid #30363d;
  color: var(--muted);
  border-radius: 3px;
  padding: 0 3px;
  margin-left: 3px;
  vertical-align: middle;
}

/* Loading/error */
.msg { color: var(--muted); padding: 60px 0; text-align: center; font-size: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border); border-top-color: var(--blue-t);
  border-radius: 50%; animation: spin .8s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
</style>

<script>
/* ── Config ── */
const WALLET = '0x9c16bc8f1104e4d2f72267eb981fa12de7cc4a6f';
const CHAINS = [
  { name: 'base',      rpc: 'https://base-rpc.publicnode.com',              pm: '0x03a520b32C04BF3bEEf7BEb72E919cf822Ed34f1', factory: '0x33128a8fC17869897dcE68Ed026d694621f6FDfD', badge: null },
  { name: 'base-ps3',  rpc: 'https://base-rpc.publicnode.com',              pm: '0x46A15B0b27311cedF172AB29E4f4766fbE7F4364', factory: '0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865', badge: 'PCS' },
  { name: 'arbitrum',  rpc: 'https://arbitrum-one-rpc.publicnode.com',     pm: '0xC36442b4a4522E871399CD717aBDD847Ab11FE88', factory: '0x1F98431c8aD98523631AE4a59f267346ea31F984', badge: 'arb' },
];

/* ── ABI helpers ── */
const encA = a => '000000000000000000000000' + a.slice(2).toLowerCase();
const encU = n => BigInt(n).toString(16).padStart(64, '0');
const dU   = (h, s) => { const x = h.replace(/^0x/,''); return BigInt('0x' + x.slice(s*64, s*64+64)); };
const dI   = (h, s) => { const r = dU(h, s); return r >= 2n**255n ? r - 2n**256n : r; };
const dAddr= (h, s) => { const x = h.replace(/^0x/,''); return '0x' + x.slice(s*64+24, s*64+64); };
function dSym(h) {
  if (!h || h === '0x' || h.length < 66) return '?';
  const x = h.replace(/^0x/,'');
  if (BigInt('0x'+x.slice(0,64)) === 0x20n && x.length >= 192) {
    try {
      const len = Number(BigInt('0x'+x.slice(64,128)));
      if (len > 0 && len <= 50) {
        const b = new Uint8Array(x.slice(128,128+len*2).match(/.{2}/g).map(v=>parseInt(v,16)));
        return new TextDecoder().decode(b);
      }
    } catch(_) {}
  }
  const bytes = [];
  for (let i = 0; i < 64; i += 2) { const b = parseInt(x.slice(i,i+2),16); if (!b) break; bytes.push(b); }
  return bytes.length ? String.fromCharCode(...bytes) : '?';
}

const SEL = {
  balanceOf:           '0x70a08231',
  tokenOfOwnerByIndex: '0x2f745c59',
  positions:           '0x99fbab88',
  getPool:             '0x1698ee82',
  slot0:               '0x3850c7bd',
  symbol:              '0x95d89b41',
  decimals:            '0x313ce567',
};
const ZERO = '0x0000000000000000000000000000000000000000';
const STABLES = new Set(['USDC','USDT','DAI','FRAX','BUSD','LUSD','crvUSD','USDBC','USDB','USDe']);

async function rpcBatch(calls, rpc, size = 50) {
  const out = [];
  for (let i = 0; i < calls.length; i += size) {
    const ch = calls.slice(i, i + size);
    const body = ch.map((c, j) => ({ jsonrpc: '2.0', id: j, method: 'eth_call', params: [c, 'latest'] }));
    const r = await fetch(rpc, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(15000),
    });
    const arr = await r.json();
    if (Array.isArray(arr)) {
      const tmp = new Array(ch.length).fill(null);
      for (const item of arr) if (typeof item.id === 'number') tmp[item.id] = item.result || null;
      out.push(...tmp);
    } else {
      for (const c of ch) {
        try {
          const sr = await fetch(rpc, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[c,'latest']}),
            signal: AbortSignal.timeout(12000) });
          const sj = await sr.json();
          out.push(sj.result || null);
        } catch(_) { out.push(null); }
      }
    }
  }
  return out;
}

function t2p(tick, d0, d1) { return Math.pow(1.0001, tick) * Math.pow(10, d0 - d1); }
function fmt(p) {
  if (!isFinite(p) || isNaN(p) || p <= 0) return '-';
  if (p >= 1e6)  return (p/1e6).toFixed(2)+'M';
  if (p >= 1e4)  return p.toLocaleString('en', {maximumFractionDigits:0});
  if (p >= 1000) return p.toFixed(1);
  if (p >= 1)    return p.toFixed(2);
  if (p >= .01)  return p.toFixed(4);
  return p.toExponential(3);
}
function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function fmtUsd(v) {
  if (!isFinite(v) || v <= 0) return '-';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'k';
  return '$' + v.toFixed(0);
}

function calcAmounts(liquidity, tL, tU, tC, dd0, dd1) {
  const L  = Number(liquidity);
  const sP = Math.pow(1.0001, tC / 2);
  const sA = Math.pow(1.0001, tL / 2);
  const sB = Math.pow(1.0001, tU / 2);
  let a0, a1;
  if (tC <= tL)      { a0 = L * (sB - sA) / (sA * sB); a1 = 0; }
  else if (tC >= tU) { a0 = 0; a1 = L * (sB - sA); }
  else               { a0 = L * (sB - sP) / (sP * sB); a1 = L * (sP - sA); }
  return { amt0: a0 / Math.pow(10, dd0), amt1: a1 / Math.pow(10, dd1) };
}

function assignLanes(sorted) {
  const lanes = sorted.map(() => -1);
  for (let i = 0; i < sorted.length; i++) {
    const used = new Set();
    for (let j = 0; j < i; j++) {
      if (sorted[j].pLow < sorted[i].pHi && sorted[j].pHi > sorted[i].pLow)
        used.add(lanes[j]);
    }
    let lane = 0;
    while (used.has(lane)) lane++;
    lanes[i] = lane;
  }
  const total = Math.max(...lanes) + 1;
  return lanes.map(l => ({ lane: l, total }));
}

async function fetchPositions(wallet, chain) {
  const balHex = await (await fetch(chain.rpc, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:chain.pm,data:SEL.balanceOf+encA(wallet)},'latest']}),
    signal: AbortSignal.timeout(12000),
  })).json().then(j => j.result);

  const bal = Number(dU(balHex, 0));
  if (bal === 0) return [];

  const idxCalls = Array.from({length:bal},(_,i) => ({to:chain.pm, data:SEL.tokenOfOwnerByIndex+encA(wallet)+encU(i)}));
  const idxRes   = await rpcBatch(idxCalls, chain.rpc);
  const tokenIds = idxRes.map(r => r && r !== '0x' ? dU(r, 0) : null).filter(Boolean);

  const posRes = await rpcBatch(tokenIds.map(id => ({to:chain.pm, data:SEL.positions+encU(id)})), chain.rpc);
  const raw = posRes.map((r,i) => {
    if (!r || r.length < 770) return null;
    const liq = dU(r, 7);
    if (liq === 0n) return null;
    return { id: tokenIds[i].toString(), token0: dAddr(r,2), token1: dAddr(r,3),
             fee: Number(dU(r,4)), tickLower: Number(dI(r,5)), tickUpper: Number(dI(r,6)), liquidity: liq };
  }).filter(Boolean);
  if (!raw.length) return [];

  const uniqueKeys = [...new Map(raw.map(p => [`${p.token0}:${p.token1}:${p.fee}`, p])).values()];
  const poolRes = await rpcBatch(uniqueKeys.map(p => ({to:chain.factory, data:SEL.getPool+encA(p.token0)+encA(p.token1)+encU(p.fee)})), chain.rpc);
  const poolMap = {};
  uniqueKeys.forEach((p,i) => {
    if (poolRes[i] && poolRes[i] !== '0x') {
      const a = dAddr(poolRes[i],0);
      if (a !== ZERO) poolMap[`${p.token0}:${p.token1}:${p.fee}`] = a;
    }
  });

  const uniquePools = [...new Set(Object.values(poolMap))];
  const s0Res = await rpcBatch(uniquePools.map(a => ({to:a, data:SEL.slot0})), chain.rpc);
  const slot0Map = {};
  uniquePools.forEach((a,i) => {
    if (s0Res[i] && s0Res[i].length >= 66)
      slot0Map[a] = { tick: Number(dI(s0Res[i], 1)) };
  });

  const uniqueTokens = [...new Set([...raw.map(p=>p.token0),...raw.map(p=>p.token1)])];
  const tokRes = await rpcBatch(uniqueTokens.flatMap(a => [{to:a,data:SEL.symbol},{to:a,data:SEL.decimals}]), chain.rpc);
  const tokenMap = {};
  uniqueTokens.forEach((a,i) => {
    tokenMap[a] = { symbol: dSym(tokRes[i*2]), decimals: tokRes[i*2+1] ? String(Number(dU(tokRes[i*2+1],0))) : '18' };
  });

  return raw.map(p => {
    const key   = `${p.token0}:${p.token1}:${p.fee}`;
    const pAddr = poolMap[key] || ZERO;
    const s0    = slot0Map[pAddr] || { tick: 0 };
    const t0    = tokenMap[p.token0] || { symbol:'?', decimals:'18' };
    const t1    = tokenMap[p.token1] || { symbol:'?', decimals:'18' };
    const d0 = parseInt(t0.decimals), d1 = parseInt(t1.decimals);
    const flip  = STABLES.has(t0.symbol) && !STABLES.has(t1.symbol);
    const tL = flip ? -p.tickUpper : p.tickLower;
    const tU = flip ? -p.tickLower : p.tickUpper;
    const tC = flip ? -s0.tick     : s0.tick;
    const dd0 = flip ? d1 : d0, dd1 = flip ? d0 : d1;
    const pLow = t2p(tL, dd0, dd1), pHi = t2p(tU, dd0, dd1), pCur = t2p(tC, dd0, dd1);
    const unit = flip ? t0.symbol : t1.symbol;
    const base = flip ? t1.symbol : t0.symbol;
    const inR  = tC >= tL && tC <= tU;
    return { pLow, pHi, pCur, unit, base, inR, fee: p.fee, id: p.id,
             liquidity: p.liquidity, tL, tU, tC, dd0, dd1, poolAddr: pAddr,
             chain: chain.name, chainBadge: chain.badge || null };
  });
}

async function fetchAerodromePositions(aprJson) {
  const raw = aprJson.aerodrome || [];
  if (!raw.length) return [];

  const BASE_RPC = 'https://base-rpc.publicnode.com';
  const uniquePools = [...new Set(raw.map(p => p.pool))];
  const s0Res = await rpcBatch(uniquePools.map(a => ({to:a, data:SEL.slot0})), BASE_RPC);
  const slot0Map = {};
  uniquePools.forEach((a, i) => {
    if (s0Res[i] && s0Res[i].length >= 66)
      slot0Map[a] = { tick: Number(dI(s0Res[i], 1)) };
  });

  const out = [];
  for (const pos of raw) {
    const sym0 = pos.token0_symbol || '?';
    const sym1 = pos.token1_symbol || '?';
    const d0 = pos.token0_decimals ?? 18;
    const d1 = pos.token1_decimals ?? 18;
    const s0 = slot0Map[pos.pool];
    const flip = STABLES.has(sym0) && !STABLES.has(sym1);
    const tL = flip ? -pos.tick_upper : pos.tick_lower;
    const tU = flip ? -pos.tick_lower : pos.tick_upper;
    const tC = s0 ? (flip ? -s0.tick : s0.tick) : ((tL + tU) / 2);
    const dd0 = flip ? d1 : d0, dd1 = flip ? d0 : d1;
    const pLow = t2p(tL, dd0, dd1), pHi = t2p(tU, dd0, dd1), pCur = t2p(tC, dd0, dd1);
    const unit = flip ? sym0 : sym1;
    const base = flip ? sym1 : sym0;
    const inR = s0 ? (tC >= tL && tC <= tU) : pos.in_range;
    out.push({
      pLow, pHi, pCur, unit, base, inR,
      fee: pos.fee_tier,
      id: String(pos.nft_id),
      liquidity: 0n, tL, tU, tC, dd0, dd1,
      poolAddr: pos.pool,
      chain: 'base', chainBadge: 'AERO',
      fromApi: true,
      underlyingValue: pos.underlying_value || 0,
    });
  }
  return out;
}

async function fetchAprData() {
  try {
    const r = await fetch('./apr.json?ts=' + Date.now(), { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return { aprMap: {}, walletCollateral: {}, aprJson: {} };
    const j = await r.json();
    const aprMap = {};
    for (const [nftId, p] of Object.entries(j.positions || {})) {
      aprMap[nftId] = {
        fee_apr:    p.fee_apr,
        net_roi:    p.net_roi,
        collateral: !!p.collateral,
        debt_usdc:  p.debt_usdc || 0,
      };
    }
    for (const p of (j.aerodrome || [])) {
      if (p.fee_apr > 0) {
        aprMap[String(p.nft_id)] = { fee_apr: p.fee_apr };
      }
    }
    return { aprMap, walletCollateral: j.wallet_collateral || {}, aprJson: j };
  } catch { return { aprMap: {}, walletCollateral: {}, aprJson: {} }; }
}

async function fetchCollateralPositions(nftIds, chain) {
  if (!nftIds.length) return [];
  const tokenIds = nftIds.map(id => BigInt(id));
  const posRes = await rpcBatch(tokenIds.map(id => ({to:chain.pm, data:SEL.positions+encU(id)})), chain.rpc);
  const raw = posRes.map((r,i) => {
    if (!r || r.length < 770) return null;
    const liq = dU(r, 7);
    if (liq === 0n) return null;
    return { id: tokenIds[i].toString(), token0: dAddr(r,2), token1: dAddr(r,3),
             fee: Number(dU(r,4)), tickLower: Number(dI(r,5)), tickUpper: Number(dI(r,6)), liquidity: liq };
  }).filter(Boolean);
  if (!raw.length) return [];

  const uniqueKeys = [...new Map(raw.map(p => [`${p.token0}:${p.token1}:${p.fee}`, p])).values()];
  const poolRes = await rpcBatch(uniqueKeys.map(p => ({to:chain.factory, data:SEL.getPool+encA(p.token0)+encA(p.token1)+encU(p.fee)})), chain.rpc);
  const poolMap = {};
  uniqueKeys.forEach((p,i) => {
    if (poolRes[i] && poolRes[i] !== '0x') { const a = dAddr(poolRes[i],0); if (a !== ZERO) poolMap[`${p.token0}:${p.token1}:${p.fee}`] = a; }
  });

  const uniquePools = [...new Set(Object.values(poolMap))];
  const s0Res = await rpcBatch(uniquePools.map(a => ({to:a, data:SEL.slot0})), chain.rpc);
  const slot0Map = {};
  uniquePools.forEach((a,i) => {
    if (s0Res[i] && s0Res[i].length >= 66)
      slot0Map[a] = { tick: Number(dI(s0Res[i], 1)) };
  });

  const uniqueTokens = [...new Set([...raw.map(p=>p.token0),...raw.map(p=>p.token1)])];
  const tokRes = await rpcBatch(uniqueTokens.flatMap(a => [{to:a,data:SEL.symbol},{to:a,data:SEL.decimals}]), chain.rpc);
  const tokenMap = {};
  uniqueTokens.forEach((a,i) => {
    tokenMap[a] = { symbol: dSym(tokRes[i*2]), decimals: tokRes[i*2+1] ? String(Number(dU(tokRes[i*2+1],0))) : '18' };
  });

  return raw.map(p => {
    const key  = `${p.token0}:${p.token1}:${p.fee}`;
    const pAddr = poolMap[key] || ZERO;
    const s0   = slot0Map[pAddr] || { tick: 0 };
    const t0   = tokenMap[p.token0] || { symbol:'?', decimals:'18' };
    const t1   = tokenMap[p.token1] || { symbol:'?', decimals:'18' };
    const d0 = parseInt(t0.decimals), d1 = parseInt(t1.decimals);
    const flip = STABLES.has(t0.symbol) && !STABLES.has(t1.symbol);
    const tL = flip ? -p.tickUpper : p.tickLower;
    const tU = flip ? -p.tickLower : p.tickUpper;
    const tC = flip ? -s0.tick     : s0.tick;
    const dd0 = flip ? d1 : d0, dd1 = flip ? d0 : d1;
    const pLow = t2p(tL, dd0, dd1), pHi = t2p(tU, dd0, dd1), pCur = t2p(tC, dd0, dd1);
    const unit = flip ? t0.symbol : t1.symbol;
    const base = flip ? t1.symbol : t0.symbol;
    const inR  = tC >= tL && tC <= tU;
    return { pLow, pHi, pCur, unit, base, inR, fee: p.fee, id: p.id,
             liquidity: p.liquidity, tL, tU, tC, dd0, dd1, poolAddr: pAddr,
             isCollateral: true, chain: chain.name, chainBadge: chain.badge || null };
  });
}

/* ── Render a coin card ── */
function renderCoinCard(base, positions, aprMap) {
  const clamp = (p, pos) => (!isFinite(p) || p <= 0) ? pos.pCur * (p <= 0 ? 0.1 : 10) : p;
  const sorted = [...positions].sort((a, b) => clamp(b.pHi, b) - clamp(a.pHi, a));
  const pCur   = sorted[0].pCur;

  const clampedPrices = sorted.map(p => ({
    pLow: clamp(p.pLow, p), pHi: clamp(p.pHi, p),
  }));
  const gMin = Math.min(...clampedPrices.map(p => p.pLow)) * 0.96;
  const gMax = Math.max(...clampedPrices.map(p => p.pHi))  * 1.04;
  const range = gMax - gMin;

  const H = Math.max(140, sorted.length * 26 + 40);
  const yPct = p => (1 - (p - gMin) / range) * 100;
  const curY  = yPct(pCur);

  const laneInfo = assignLanes(sorted.map((p, i) => ({ ...p, pLow: clampedPrices[i].pLow, pHi: clampedPrices[i].pHi })));
  let bars = '';
  sorted.forEach((pos, idx) => {
    const cph = clampedPrices[idx];
    const yTop  = yPct(cph.pHi);
    const yBot  = yPct(cph.pLow);
    const top   = yTop.toFixed(2) + '%';
    const ht    = Math.max(1, yBot - yTop).toFixed(2) + '%';
    const cls   = pos.inR ? 'in' : 'out';
    const dLow  = (pCur - pos.pLow) / pCur * 100;
    const dHi   = (pos.pHi - pCur)  / pCur * 100;
    const { lane, total } = laneInfo[idx];
    const pctW  = 100 / total;
    const lPct  = (lane * pctW).toFixed(2);
    const rPct  = ((total - lane - 1) * pctW).toFixed(2);
    const tip   = pos.inR
      ? `#${pos.id} ${fmt(pos.pLow)}-${fmt(pos.pHi)} ${pos.unit} | ${fmtPct(dLow)} / ${fmtPct(dHi)}`
      : `#${pos.id} ${fmt(pos.pLow)}-${fmt(pos.pHi)} ${pos.unit}`;
    bars += `<div class="range-bar ${cls}" style="top:${top};height:${ht};left:calc(${lPct}% + 3px);right:calc(${rPct}% + 3px)"><span class="tip">${tip}</span></div>`;
  });

  const inCnt  = sorted.filter(p => p.inR).length;
  const outCnt = sorted.length - inCnt;

  // Unique pairs in this group
  const pairs = [...new Set(sorted.map(p => `${p.base}/${p.unit}`))].join(', ');

  // Total USD in group
  const totalUsd = sorted.reduce((s, pos) => {
    if (pos.fromApi) return s + (pos.underlyingValue || 0);
    const { amt0, amt1 } = calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
    return s + amt0 * pos.pCur + amt1;
  }, 0);

  let rows = '';
  sorted.forEach(pos => {
    const inR    = pos.inR;
    const dLow   = (pCur - pos.pLow) / pCur * 100;
    const dHi    = (pos.pHi - pCur)  / pCur * 100;
    const { amt0, amt1 } = pos.fromApi ? { amt0: 0, amt1: 0 } : calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
    const usd    = pos.fromApi ? (pos.underlyingValue || 0) : (amt0 * pos.pCur + amt1);
    const distTxt = inR
      ? `<span style="color:#3a6040">${fmtPct(dLow)}</span> <span style="color:var(--dim)">·</span> <span style="color:#3a6040">${fmtPct(dHi)}</span>`
      : pCur < pos.pLow
        ? `<span style="color:#6b2e2e">${fmtPct(dLow)} below</span>`
        : `<span style="color:#6b2e2e">${fmtPct(dHi)} above</span>`;
    const met = aprMap[pos.id] || {};
    const fmtMetric = v => (typeof v !== 'number')
      ? `<span style="color:var(--dim)">-</span>`
      : `<span style="color:${v >= 0 ? 'var(--green-t)' : 'var(--red-t)'}">${Math.round(v)}%</span>`;
    const colBadge   = pos.isCollateral ? '<span class="ctag">C</span>' : '';
    const feeBadge   = `<span class="fee-tag">${(pos.fee/1e4).toFixed(2)}%</span>`;
    const chainBadge = pos.chainBadge
      ? `<span class="fee-tag" style="color:#a371f7;border-color:#6e40c966">${pos.chainBadge}</span>` : '';
    const debtHtml   = (met.collateral && met.debt_usdc > 0)
      ? `<span style="color:#d29922">${fmtUsd(met.debt_usdc)}</span>`
      : `<span style="color:var(--dim)">-</span>`;
    rows += `<tr>
      <td style="color:${inR?'var(--green-t)':'var(--red-t)'};font-size:10px">#${pos.id}${colBadge}${feeBadge}${chainBadge}</td>
      <td>${fmt(pos.pLow)}</td>
      <td>${fmt(pos.pHi)}</td>
      <td style="color:var(--muted);font-size:10px">${fmt(pos.pHi - pos.pLow)}</td>
      <td style="color:var(--orange);font-size:10px">${fmtUsd(usd)}</td>
      <td style="font-size:10px">${fmtMetric(met.net_roi)}</td>
      <td style="font-size:10px">${fmtMetric(met.fee_apr)}</td>
      <td style="font-size:10px">${debtHtml}</td>
      <td style="font-size:10px">${distTxt}</td>
    </tr>`;
  });

  const baseCoin = base.split('/')[0];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
<div class="card-hdr">
  <span class="coin-tag">${baseCoin}</span>
  <span class="coin-pair">${pairs}</span>
  <span class="price-badge">${fmt(pCur)} ${sorted[0].unit}</span>
  <span class="cnt">
    <span style="color:#3fb950">${inCnt} in</span>
    <span style="color:var(--dim)"> / </span>
    <span style="color:#f85149">${outCnt} out</span>
    <span style="color:var(--dim)"> · </span>
    <span style="color:var(--orange)">${fmtUsd(totalUsd)}</span>
  </span>
</div>
<div class="chart-wrap">
  <div class="chart" style="height:${H}px">
    <div class="cur-line" data-price="${fmt(pCur)} ${sorted[0].unit}" style="top:${curY.toFixed(2)}%"></div>
    ${bars}
  </div>
</div>
<table class="tbl">
  <thead><tr>
    <th>NFT</th><th>Lower</th><th>Upper</th><th>Width</th><th>Size</th><th>ROI</th><th>Fee APR</th><th>Debt</th><th>Distance</th>
  </tr></thead>
  <tbody>${rows}</tbody>
</table>`;
  return card;
}

/* ── Main ── */
async function main() {
  const short = WALLET.slice(0,8) + '...' + WALLET.slice(-6);
  document.getElementById('waddr').textContent = short;

  const { aprMap, walletCollateral, aprJson } = await fetchAprData();

  let positions;
  try {
    const [chainResults, aeroPos] = await Promise.all([
      Promise.all(CHAINS.map(async chain => {
        try {
          const pos = await fetchPositions(WALLET, chain);
          const existingIds = new Set(pos.map(p => p.id));
          const allCollIds = (walletCollateral[WALLET.toLowerCase()] || []).map(String);
          const collIds = allCollIds.filter(id => {
            if (existingIds.has(id)) return false;
            const posChain = aprMap[id]?.chain || 'base';
            if (chain.name === 'base-ps3') return false;
            return posChain === chain.name || (posChain === 'base' && chain.name === 'base');
          });
          if (collIds.length) {
            const collPos = await fetchCollateralPositions(collIds.map(Number), chain);
            pos.push(...collPos);
          }
          return pos;
        } catch(e) {
          console.warn(`Chain ${chain.name} error:`, e);
          return [];
        }
      })),
      fetchAerodromePositions(aprJson),
    ]);
    positions = [...chainResults.flat(), ...aeroPos];
  } catch(e) {
    document.getElementById('grid-wrap').innerHTML =
      `<div class="msg" style="color:#f85149">Error: ${e.message}</div>`;
    return;
  }

  if (!positions.length) {
    document.getElementById('grid-wrap').innerHTML =
      '<div class="msg">No active positions found</div>';
    return;
  }

  // Group by base/unit pair (same price axis required for chart)
  const groups = {};
  for (const pos of positions) {
    const key = `${pos.base}/${pos.unit}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(pos);
  }

  // Sort groups by total USD value descending
  const sortedGroups = Object.entries(groups).sort((a, b) => {
    const sumUsd = arr => arr.reduce((s, pos) => {
      if (pos.fromApi) return s + (pos.underlyingValue || 0);
      const { amt0, amt1 } = calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
      return s + amt0 * pos.pCur + amt1;
    }, 0);
    return sumUsd(b[1]) - sumUsd(a[1]);
  });

  // Stats bar
  const totalUsd = positions.reduce((s, pos) => {
    if (pos.fromApi) return s + (pos.underlyingValue || 0);
    const { amt0, amt1 } = calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
    return s + amt0 * pos.pCur + amt1;
  }, 0);
  const totalIn  = positions.filter(p => p.inR).length;
  const totalOut = positions.length - totalIn;

  document.getElementById('sbar').innerHTML = `
    <div class="sbar-item">
      <span class="sbar-lbl">LP Value</span>
      <span class="sbar-val" style="color:var(--orange)">${fmtUsd(totalUsd)}</span>
    </div>
    <div class="sbar-divv"></div>
    <div class="sbar-item">
      <span class="sbar-lbl">Positions</span>
      <span class="sbar-val">${positions.length}</span>
    </div>
    <div class="sbar-divv"></div>
    <div class="sbar-item">
      <span class="sbar-lbl">In Range</span>
      <span class="sbar-val pos">${totalIn}</span>
    </div>
    <div class="sbar-divv"></div>
    <div class="sbar-item">
      <span class="sbar-lbl">Out of Range</span>
      <span class="sbar-val neg">${totalOut}</span>
    </div>
    <div class="sbar-divv"></div>
    <div class="sbar-item">
      <span class="sbar-lbl">Pairs</span>
      <span class="sbar-val" style="color:var(--blue-t)">${sortedGroups.length}</span>
    </div>`;

  // Build grid
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const [base, posArr] of sortedGroups) {
    grid.appendChild(renderCoinCard(base, posArr, aprMap));
  }

  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(grid);

  document.getElementById('ts').textContent =
    'Base+Arb · Updated ' + new Date().toLocaleTimeString();
}

main().catch(e => {
  document.getElementById('grid-wrap').innerHTML =
    `<div class="msg" style="color:#f85149">${e.message}</div>`;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP Ranges - Both Wallets</title>
<style>
:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #21262d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --dim:     #484f58;
  --green:   #2ea043;
  --green-t: #3fb950;
  --green-bg:#0a1f0e;
  --red:     #da3633;
  --red-t:   #f85149;
  --red-bg:  #1e0a0a;
  --blue-t:  #58a6ff;
  --orange:  #f0883e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono','Cascadia Code','Fira Code',monospace;
  font-size: 12px;
  min-height: 100vh;
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.hdr h1 { font-size: 15px; font-weight: 700; }
.hdr h1 em { color: var(--blue-t); font-style: normal; }
.hdr a {
  margin-left: auto;
  font-size: 11px;
  color: var(--dim);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  transition: color .15s, border-color .15s;
}
.hdr a:hover { color: var(--blue-t); border-color: var(--blue-t); }
.ts { font-size: 10px; color: var(--dim); }

/* ── Main layout ── */
.main {
  display: flex;
  gap: 2px;
  background: var(--border);
  min-height: calc(100vh - 49px);
}
.col {
  flex: 1;
  background: var(--bg);
  padding: 16px;
  min-width: 0;
}
.col-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.wtag {
  background: #0c1f3d;
  border: 1px solid #1f6feb66;
  border-radius: 4px;
  color: var(--blue-t);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 2px 8px;
  text-transform: uppercase;
}
.waddr { color: var(--muted); font-size: 11px; }
.cnt { margin-left: auto; font-size: 11px; color: var(--dim); }

/* ── Price chart ── */
.chart-wrap {
  position: relative;
  margin-bottom: 16px;
}
.chart {
  position: relative;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}
.cur-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--orange);
  z-index: 10;
  pointer-events: none;
}
.cur-line::after {
  content: attr(data-price);
  position: absolute;
  right: 6px;
  top: -9px;
  font-size: 9px;
  color: var(--orange);
  white-space: nowrap;
  background: var(--surface);
  padding: 1px 3px;
}
.range-bar {
  position: absolute;
  border-radius: 3px;
  cursor: default;
  transition: opacity .15s;
}
.range-bar:hover { opacity: .85; }
.range-bar.in  { background: linear-gradient(90deg,#1a5c2a,var(--green),#1a5c2a); }
.range-bar.out { background: var(--red-bg); border: 1px solid #6b2020; }
.range-bar .tip {
  display: none;
  position: absolute;
  left: 50%; top: -24px;
  transform: translateX(-50%);
  background: #1c2128;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 9px;
  padding: 2px 6px;
  white-space: nowrap;
  z-index: 20;
}
.range-bar:hover .tip { display: block; }

/* ── Table ── */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.tbl th {
  text-align: left;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 0 6px 6px;
  border-bottom: 1px solid var(--border);
}
.tbl td {
  padding: 5px 6px;
  border-bottom: 1px solid #161b2266;
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
.dot.in  { background: var(--green-t); }
.dot.out { background: var(--red-t); }
.prange { font-size: 11px; letter-spacing: -.2px; }
.pwidth { color: var(--muted); font-size: 10px; }
.dist   { color: var(--dim); font-size: 10px; }

/* ── Loading / error ── */
.msg { color: var(--muted); padding: 40px 0; text-align: center; font-size: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin {
  display: inline-block; width: 13px; height: 13px;
  border: 2px solid var(--border); border-top-color: var(--blue-t);
  border-radius: 50%; animation: spin .8s linear infinite;
  vertical-align: middle; margin-right: 6px;
}

/* ── State bar ── */
.sbar {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--border);
  font-size: 11px;
}
.sbar-half {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 8px 16px;
  background: var(--surface);
  overflow-x: auto;
  gap: 0;
  min-height: 48px;
}
.sbar-mid { width: 2px; flex-shrink: 0; }
.sbar-divv {
  width: 1px;
  background: var(--border);
  align-self: stretch;
  margin: 0 4px;
  flex-shrink: 0;
}
.sbar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 0 8px;
  min-width: 58px;
  max-width: 110px;
}
.sbar-item:first-child { padding-left: 0; }
.sbar-lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
.sbar-val { font-size: 12px; font-weight: 600; color: var(--text); }
.sbar-delta { font-size: 10px; }
.pos { color: var(--green-t); }
.neg { color: var(--red-t); }
</style>

<script>
/* ── Config ── */
const WALLETS = [
  { n: 1, addr: '0x9c16bc8f1104e4d2f72267eb981fa12de7cc4a6f' },
  { n: 2, addr: '0x2534acb6365e902c986a7aAaB3e9761f92D97693' },
  { n: 3, addr: '0x9e309c439c118804d9c2cf5eac4dfc62cc6f95c2' },
  { n: 4, addr: '0xdd1fbdbbaaed09bcfdfb0b7a7d001ab5791c3511' },
];
const CHAIN = {
  rpc:       'https://base-rpc.publicnode.com',
  pm:        '0x03a520b32C04BF3bEEf7BEb72E919cf822Ed34f1',
  factory:   '0x33128a8fC17869897dcE68Ed026d694621f6FDfD',
  batchSize: 50,
};

/* ── ABI helpers (same as index.html) ── */
const encA = a => '000000000000000000000000' + a.slice(2).toLowerCase();
const encU = n => BigInt(n).toString(16).padStart(64, '0');
const dU   = (h, s) => { const x = h.replace(/^0x/,''); return BigInt('0x' + x.slice(s*64, s*64+64)); };
const dI   = (h, s) => { const r = dU(h, s); return r >= 2n**255n ? r - 2n**256n : r; };
const dAddr= (h, s) => { const x = h.replace(/^0x/,''); return '0x' + x.slice(s*64+24, s*64+64); };
function dSym(h) {
  if (!h || h === '0x' || h.length < 66) return '?';
  const x = h.replace(/^0x/,'');
  if (BigInt('0x'+x.slice(0,64)) === 0x20n && x.length >= 192) {
    try {
      const len = Number(BigInt('0x'+x.slice(64,128)));
      if (len > 0 && len <= 50) {
        const b = new Uint8Array(x.slice(128,128+len*2).match(/.{2}/g).map(v=>parseInt(v,16)));
        return new TextDecoder().decode(b);
      }
    } catch(_) {}
  }
  const bytes = [];
  for (let i = 0; i < 64; i += 2) { const b = parseInt(x.slice(i,i+2),16); if (!b) break; bytes.push(b); }
  return bytes.length ? String.fromCharCode(...bytes) : '?';
}

const SEL = {
  balanceOf:           '0x70a08231',
  tokenOfOwnerByIndex: '0x2f745c59',
  positions:           '0x99fbab88',
  getPool:             '0x1698ee82',
  slot0:               '0x3850c7bd',
  symbol:              '0x95d89b41',
  decimals:            '0x313ce567',
};
const ZERO = '0x0000000000000000000000000000000000000000';
const STABLES = new Set(['USDC','USDT','DAI','FRAX','BUSD','LUSD','crvUSD','USDBC','USDB','USDe']);

async function rpcBatch(calls, size = 50) {
  const out = [];
  for (let i = 0; i < calls.length; i += size) {
    const ch = calls.slice(i, i + size);
    const body = ch.map((c, j) => ({ jsonrpc: '2.0', id: j, method: 'eth_call', params: [c, 'latest'] }));
    const r = await fetch(CHAIN.rpc, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(15000),
    });
    const arr = await r.json();
    if (Array.isArray(arr)) {
      const tmp = new Array(ch.length).fill(null);
      for (const item of arr) if (typeof item.id === 'number') tmp[item.id] = item.result || null;
      out.push(...tmp);
    } else {
      for (const c of ch) {
        try {
          const sr = await fetch(CHAIN.rpc, { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[c,'latest']}),
            signal: AbortSignal.timeout(12000) });
          const sj = await sr.json();
          out.push(sj.result || null);
        } catch(_) { out.push(null); }
      }
    }
  }
  return out;
}

function t2p(tick, d0, d1) { return Math.pow(1.0001, tick) * Math.pow(10, d0 - d1); }
function fmt(p) {
  if (!isFinite(p) || isNaN(p) || p <= 0) return '-';
  if (p >= 1e6)  return (p/1e6).toFixed(2)+'M';
  if (p >= 1e4)  return p.toLocaleString('en', {maximumFractionDigits:0});
  if (p >= 1000) return p.toFixed(1);
  if (p >= 1)    return p.toFixed(2);
  if (p >= .01)  return p.toFixed(4);
  return p.toExponential(3);
}
function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function fmtUsd(v) {
  if (!isFinite(v) || v <= 0) return '-';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'k';
  return '$' + v.toFixed(0);
}
function fmtBal(v) {
  if (!isFinite(v) || v <= 0) return '-';
  return Math.round(v).toLocaleString('en');
}

// Assign horizontal lanes to non-overlapping groups so all bars are visible
function assignLanes(sorted) {
  const lanes = sorted.map(() => -1);
  for (let i = 0; i < sorted.length; i++) {
    const used = new Set();
    for (let j = 0; j < i; j++) {
      if (sorted[j].pLow < sorted[i].pHi && sorted[j].pHi > sorted[i].pLow)
        used.add(lanes[j]);
    }
    let lane = 0;
    while (used.has(lane)) lane++;
    lanes[i] = lane;
  }
  const total = Math.max(...lanes) + 1;
  return lanes.map(l => ({ lane: l, total }));
}

// Uniswap v3 token amounts from liquidity + ticks
function calcAmounts(liquidity, tL, tU, tC, dd0, dd1) {
  const L  = Number(liquidity);
  const sP = Math.pow(1.0001, tC / 2);
  const sA = Math.pow(1.0001, tL / 2);
  const sB = Math.pow(1.0001, tU / 2);
  let a0, a1;
  if (tC <= tL)       { a0 = L * (sB - sA) / (sA * sB); a1 = 0; }
  else if (tC >= tU)  { a0 = 0; a1 = L * (sB - sA); }
  else                { a0 = L * (sB - sP) / (sP * sB); a1 = L * (sP - sA); }
  return { amt0: a0 / Math.pow(10, dd0), amt1: a1 / Math.pow(10, dd1) };
}

async function fetchPositions(wallet) {
  const balHex = await (await fetch(CHAIN.rpc, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:CHAIN.pm,data:SEL.balanceOf+encA(wallet)},'latest']}),
    signal: AbortSignal.timeout(12000),
  })).json().then(j => j.result);

  const bal = Number(dU(balHex, 0));
  if (bal === 0) return [];

  const idxCalls = Array.from({length:bal},(_,i) => ({to:CHAIN.pm, data:SEL.tokenOfOwnerByIndex+encA(wallet)+encU(i)}));
  const idxRes   = await rpcBatch(idxCalls);
  const tokenIds = idxRes.map(r => r && r !== '0x' ? dU(r, 0) : null).filter(Boolean);

  const posRes = await rpcBatch(tokenIds.map(id => ({to:CHAIN.pm, data:SEL.positions+encU(id)})));
  const raw = posRes.map((r,i) => {
    if (!r || r.length < 770) return null;
    const liq = dU(r, 7);
    if (liq === 0n) return null;
    return { id: tokenIds[i].toString(), token0: dAddr(r,2), token1: dAddr(r,3),
             fee: Number(dU(r,4)), tickLower: Number(dI(r,5)), tickUpper: Number(dI(r,6)), liquidity: liq };
  }).filter(Boolean);
  if (!raw.length) return [];

  const uniqueKeys = [...new Map(raw.map(p => [`${p.token0}:${p.token1}:${p.fee}`, p])).values()];
  const poolRes = await rpcBatch(uniqueKeys.map(p => ({to:CHAIN.factory, data:SEL.getPool+encA(p.token0)+encA(p.token1)+encU(p.fee)})));
  const poolMap = {};
  uniqueKeys.forEach((p,i) => {
    if (poolRes[i] && poolRes[i] !== '0x') { const a = dAddr(poolRes[i],0); if (a !== ZERO) poolMap[`${p.token0}:${p.token1}:${p.fee}`] = a; }
  });

  const uniquePools = [...new Set(Object.values(poolMap))];
  const s0Res = await rpcBatch(uniquePools.map(a => ({to:a, data:SEL.slot0})));
  const slot0Map = {};
  uniquePools.forEach((a,i) => {
    if (s0Res[i] && s0Res[i].length >= 66)
      slot0Map[a] = { tick: Number(dI(s0Res[i], 1)) };
  });

  const uniqueTokens = [...new Set([...raw.map(p=>p.token0),...raw.map(p=>p.token1)])];
  const tokRes = await rpcBatch(uniqueTokens.flatMap(a => [{to:a,data:SEL.symbol},{to:a,data:SEL.decimals}]));
  const tokenMap = {};
  uniqueTokens.forEach((a,i) => {
    tokenMap[a] = { symbol: dSym(tokRes[i*2]), decimals: tokRes[i*2+1] ? String(Number(dU(tokRes[i*2+1],0))) : '18' };
  });

  return raw.map(p => {
    const key   = `${p.token0}:${p.token1}:${p.fee}`;
    const pAddr = poolMap[key] || ZERO;
    const s0    = slot0Map[pAddr] || { tick: 0 };
    const t0    = tokenMap[p.token0] || { symbol:'?', decimals:'18' };
    const t1    = tokenMap[p.token1] || { symbol:'?', decimals:'18' };
    const d0 = parseInt(t0.decimals), d1 = parseInt(t1.decimals);
    const flip  = STABLES.has(t0.symbol) && !STABLES.has(t1.symbol);
    const tL = flip ? -p.tickUpper : p.tickLower;
    const tU = flip ? -p.tickLower : p.tickUpper;
    const tC = flip ? -s0.tick     : s0.tick;
    const dd0 = flip ? d1 : d0, dd1 = flip ? d0 : d1;
    const pLow = t2p(tL, dd0, dd1), pHi = t2p(tU, dd0, dd1), pCur = t2p(tC, dd0, dd1);
    const unit = flip ? t0.symbol : t1.symbol;
    const base = flip ? t1.symbol : t0.symbol;
    const inR     = tC >= tL && tC <= tU;
    const baseAddr = (flip ? p.token1 : p.token0).toLowerCase();
    const unitAddr = (flip ? p.token0 : p.token1).toLowerCase();
    const baseDec  = flip ? d1 : d0;
    const unitDec  = flip ? d0 : d1;
    return { pLow, pHi, pCur, unit, base, inR, fee: p.fee, id: p.id,
             liquidity: p.liquidity, tL, tU, tC, dd0, dd1 };
  });
}

/* ── Wallet balance (Ankr multichain) ── */
const ANKR_URL    = 'https://rpc.ankr.com/multichain/d472220a2a61a865820079c301ed608e389e3e02a51abe4e6e23efa72de2c93b';
const ANKR_CHAINS = ['eth', 'base', 'arbitrum', 'optimism', 'polygon', 'bsc', 'avalanche'];

async function fetchWalletBalance(addr) {
  try {
    const r = await fetch(ANKR_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0', id: 1,
        method: 'ankr_getAccountBalance',
        params: { walletAddress: addr, blockchain: ANKR_CHAINS, onlyWhitelisted: false },
      }),
      signal: AbortSignal.timeout(20000),
    });
    const j = await r.json();
    if (j.error) { console.warn('Ankr error', addr, j.error); return 0; }
    const total = j.result?.totalBalanceUsd;
    if (!total) { console.warn('Ankr no result', addr, j); return 0; }
    return parseFloat(total);
  } catch (e) { console.warn('Ankr fetch failed', addr, e); return 0; }
}

function renderWalletBar(snaps, w1b, w2b) {
  const el = document.getElementById('sbar-wallet');
  if (!el) return;
  const cur = snaps[snaps.length - 1];
  const prev = snaps.slice(0, -1);
  const D = 864e5, W = 7 * D, M = 30 * D, Y = 365 * D;

  const periods = [
    { lbl: '1D',     snap: closestSnap(prev, TS_NOW - D, 12 * 36e5) },
    { lbl: '1W',     snap: closestSnap(prev, TS_NOW - W, 2 * D) },
    { lbl: '1M',     snap: closestSnap(prev, TS_NOW - M, 10 * D) },
    { lbl: '1Y',     snap: closestSnap(prev, TS_NOW - Y, 45 * D) },
    { lbl: 'Initial', snap: snaps[0] || null },
  ];

  function mkHalf(label, current, field) {
    const nowHtml = `<div class="sbar-item"><span class="sbar-lbl">${label}</span><span class="sbar-val" style="color:var(--blue-t)">${fmtBal(current)}</span></div>`;
    const hist = periods.map(({ lbl, snap }) => {
      const v = snap?.[field];
      if (v == null) return `<div class="sbar-item"><span class="sbar-lbl">${lbl}</span><span class="sbar-val" style="color:var(--dim)">-</span></div>`;
      const isSame = cur && snap.ts === cur.ts;
      const pct = (!isSame && v) ? (current - v) / v * 100 : null;
      const dHtml = pct != null ? `<span class="sbar-delta ${pct >= 0 ? 'pos' : 'neg'}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</span>` : '';
      return `<div class="sbar-item"><span class="sbar-lbl">${lbl}</span><span class="sbar-val">${fmtBal(v)}</span>${dHtml}</div>`;
    }).join('');
    return `<div class="sbar-half">${nowHtml}<div class="sbar-divv"></div>${hist}</div>`;
  }

  el.innerHTML = mkHalf('W1 wallet', w1b, 'w1b') + '<div class="sbar-mid"></div>' + mkHalf('W2 wallet', w2b, 'w2b');
}

/* ── Snapshot / wallet state ── */
const SNAP_KEY = 'lp_snaps_v1';
const TS_NOW = Date.now();

function loadSnaps() {
  try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch { return []; }
}

function pruneSnaps(snaps) {
  if (snaps.length <= 100) return snaps;
  const D = 864e5;
  const keep = new Set([0, snaps.length - 1]); // always keep initial and current

  // Keep all entries from last 24h (full resolution)
  snaps.forEach((s, i) => { if (TS_NOW - s.ts <= D) keep.add(i); });

  // Generate target timestamps: 1 per day for last 30d, 1 per week for last 3y
  const targets = [];
  for (let i = 1; i <= 30; i++)  targets.push(TS_NOW - i * D);
  for (let i = 5; i <= 156; i++) targets.push(TS_NOW - i * 7 * D);

  for (const t of targets) {
    let bi = -1, bd = Infinity;
    snaps.forEach((s, i) => { const d = Math.abs(s.ts - t); if (d < bd) { bd = d; bi = i; } });
    if (bi >= 0) keep.add(bi);
  }

  return snaps.filter((_, i) => keep.has(i));
}

function saveSnap(snaps, vals) {
  if (!vals.total) return snaps;
  const last = snaps[snaps.length - 1];
  if (last && TS_NOW - last.ts < 30 * 60 * 1000) {
    const next = [...snaps.slice(0, -1), { ts: last.ts, ...vals }];
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(next)); } catch {}
    return next;
  }
  const next = pruneSnaps([...snaps, { ts: TS_NOW, ...vals }]);
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(next)); } catch {}
  return next;
}

function closestSnap(snaps, targetTs, maxDiff) {
  if (!snaps.length) return null;
  const best = snaps.reduce((b, s) => Math.abs(s.ts - targetTs) < Math.abs(b.ts - targetTs) ? s : b);
  return Math.abs(best.ts - targetTs) <= maxDiff ? best : null;
}

function calcTotalUsd(positions) {
  return positions.reduce((sum, pos) => {
    const { amt0, amt1 } = calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
    return sum + amt0 * pos.pCur + amt1;
  }, 0);
}

function renderStateBar(snaps, w1, w2) {
  const el = document.getElementById('sbar');
  if (!el) return;
  const cur = snaps[snaps.length - 1];
  const prev = snaps.slice(0, -1);
  const D = 864e5, W = 7 * D, M = 30 * D, Y = 365 * D;

  const periods = [
    { lbl: '1D',     snap: closestSnap(prev, TS_NOW - D, 12 * 36e5) },
    { lbl: '1W',     snap: closestSnap(prev, TS_NOW - W, 2 * D) },
    { lbl: '1M',     snap: closestSnap(prev, TS_NOW - M, 10 * D) },
    { lbl: '1Y',     snap: closestSnap(prev, TS_NOW - Y, 45 * D) },
    { lbl: 'Initial', snap: snaps[0] || null },
  ];

  function mkHalf(label, current, field) {
    const nowHtml = `<div class="sbar-item"><span class="sbar-lbl">${label}</span><span class="sbar-val" style="color:var(--orange)">${fmtBal(current)}</span></div>`;
    const hist = periods.map(({ lbl, snap }) => {
      if (!snap) return `<div class="sbar-item"><span class="sbar-lbl">${lbl}</span><span class="sbar-val" style="color:var(--dim)">-</span></div>`;
      const v = snap[field];
      const isSame = cur && snap.ts === cur.ts;
      const pct = (!isSame && v) ? (current - v) / v * 100 : null;
      const dHtml = pct !== null
        ? `<span class="sbar-delta ${pct >= 0 ? 'pos' : 'neg'}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</span>`
        : '';
      return `<div class="sbar-item"><span class="sbar-lbl">${lbl}</span><span class="sbar-val">${fmtBal(v)}</span>${dHtml}</div>`;
    }).join('');
    return `<div class="sbar-half">${nowHtml}<div class="sbar-divv"></div>${hist}</div>`;
  }

  el.innerHTML = mkHalf('W1', w1, 'w1') + '<div class="sbar-mid"></div>' + mkHalf('W2', w2, 'w2');
}

/* ── Render column ── */
function renderCol(el, n, addr, positions, globalMin, globalMax, err) {
  if (err) {
    el.innerHTML = `<div class="msg" style="color:#f85149">Error: ${err}</div>`;
    return;
  }
  const short = addr.slice(0,8) + '...' + addr.slice(-6);

  if (!positions.length) {
    el.innerHTML = `
      <div class="col-hdr">
        <span class="wtag">Wallet ${n}</span>
        <span class="waddr">${short}</span>
      </div>
      <div class="msg">No active positions</div>`;
    return;
  }

  // Sort from max to min (highest upper bound first)
  const sorted = [...positions].sort((a,b) => b.pHi - a.pHi);
  const pCur   = sorted[0].pCur;
  const range  = globalMax - globalMin;

  // Chart height: 8px per position + some padding
  const H = Math.max(200, sorted.length * 28 + 40);

  // Y position helpers (price → % from top, since higher price = top)
  const yPct = p => (1 - (p - globalMin) / range) * 100;
  const curY  = yPct(pCur);

  const laneInfo = assignLanes(sorted);
  let bars = '';
  sorted.forEach((pos, idx) => {
    const yTop  = yPct(pos.pHi);
    const yBot  = yPct(pos.pLow);
    const top   = yTop.toFixed(2) + '%';
    const ht    = Math.max(1, yBot - yTop).toFixed(2) + '%';
    const cls   = pos.inR ? 'in' : 'out';
    const dLow  = (pCur - pos.pLow) / pCur * 100;
    const dHi   = (pos.pHi - pCur)  / pCur * 100;
    const { lane, total } = laneInfo[idx];
    const pctW  = 100 / total;
    const lPct  = (lane * pctW).toFixed(2);
    const rPct  = ((total - lane - 1) * pctW).toFixed(2);
    const laneStyle = `left:calc(${lPct}% + 3px);right:calc(${rPct}% + 3px);`;
    const tip   = pos.inR
      ? `#${pos.id} ${fmt(pos.pLow)}-${fmt(pos.pHi)} ${pos.unit} | ${fmtPct(dLow)} / ${fmtPct(dHi)}`
      : `#${pos.id} ${fmt(pos.pLow)}-${fmt(pos.pHi)} ${pos.unit}`;
    bars += `<div class="range-bar ${cls}" style="top:${top};height:${ht};${laneStyle}"><span class="tip">${tip}</span></div>`;
  });

  const inCnt  = sorted.filter(p => p.inR).length;
  const outCnt = sorted.length - inCnt;
  const unit   = sorted[0].unit;

  // Table rows
  let rows = '';
  sorted.forEach(pos => {
    const inR    = pos.inR;
    const dLow   = (pCur - pos.pLow) / pCur * 100;
    const dHi    = (pos.pHi - pCur)  / pCur * 100;
    const { amt0, amt1 } = calcAmounts(pos.liquidity, pos.tL, pos.tU, pos.tC, pos.dd0, pos.dd1);
    const usd    = amt0 * pCur + amt1;
    const distTxt = inR
      ? `<span style="color:#3a6040">${fmtPct(dLow)}</span> <span style="color:var(--dim)">·</span> <span style="color:#3a6040">${fmtPct(dHi)}</span>`
      : pCur < pos.pLow
        ? `<span style="color:#6b2e2e">${fmtPct(dLow)} below</span>`
        : `<span style="color:#6b2e2e">${fmtPct(dHi)} above</span>`;
    rows += `<tr>
      <td style="color:${inR?'var(--green-t)':'var(--red-t)'};font-size:10px">#${pos.id}</td>
      <td>${fmt(pos.pLow)}</td>
      <td>${fmt(pos.pHi)}</td>
      <td class="pwidth">= ${fmt(pos.pHi - pos.pLow)}</td>
      <td style="color:var(--orange);font-size:10px">${fmtUsd(usd)}</td>
      <td class="dist">${distTxt}</td>
    </tr>`;
  });

  el.innerHTML = `
<div class="col-hdr">
  <span class="wtag">Wallet ${n}</span>
  <span class="waddr">${short}</span>
  <span class="cnt">
    <span style="color:#3fb950">${inCnt} in</span>
    <span style="color:var(--dim)"> / </span>
    <span style="color:#f85149">${outCnt} out</span>
  </span>
</div>
<div class="chart-wrap">
  <div class="chart" style="height:${H}px">
    <div class="cur-line" data-price="${fmt(pCur)} ${unit}" style="top:${curY.toFixed(2)}%"></div>
    ${bars}
  </div>
</div>
<table class="tbl">
  <thead><tr>
    <th>NFT</th><th>Lower</th><th>Upper</th><th>Width</th><th>Size</th><th>Distance</th>
  </tr></thead>
  <tbody>${rows}</tbody>
</table>`;
}

/* ── Main ── */
async function main() {
  const results = await Promise.all(
    WALLETS.map(w =>
      fetchPositions(w.addr)
        .then(p => ({ ok: true, pos: p }))
        .catch(e => ({ ok: false, err: e.message, pos: [] }))
    )
  );

  const all = results.flatMap(r => r.pos || []);
  const globalMin = all.length ? Math.min(...all.map(p => p.pLow)) * 0.97 : 0;
  const globalMax = all.length ? Math.max(...all.map(p => p.pHi))  * 1.03 : 1;

  results.forEach((r, i) => {
    const el = document.getElementById(`col${i + 1}`);
    if (el) renderCol(el, i + 1, WALLETS[i].addr, r.pos || [], globalMin, globalMax, r.err);
  });

  const w1usd = results[0].ok ? calcTotalUsd(results[0].pos) : 0;
  const w2usd = results[1].ok ? calcTotalUsd(results[1].pos) : 0;

  const [w1bal, w2bal] = await Promise.all([
    fetchWalletBalance(WALLETS[0].addr),
    fetchWalletBalance(WALLETS[1].addr),
  ]);

  const w1total = w1bal + w1usd;
  const w2total = w2bal + w2usd;
  const snaps = saveSnap(loadSnaps(), { w1: w1usd, w2: w2usd, total: w1usd + w2usd, w1b: w1total, w2b: w2total });
  renderStateBar(snaps, w1usd, w2usd);
  renderWalletBar(snaps, w1total, w2total);

  document.getElementById('ts').textContent = 'Base · Updated ' + new Date().toLocaleTimeString();
}

main().catch(e => {
  document.getElementById('col1').innerHTML = `<div class="msg" style="color:#f85149">${e.message}</div>`;
});
</script>
